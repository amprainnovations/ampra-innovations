<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Page</title>
    <style>
        /* Reset defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Background Image Setup */
        .hero-background {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://amprainnovations.github.io/amprainnovations');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100%;
        }

        /* Navigation Bar Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(0, 0, 0, 0.3); /* Subtle dark overlay for readability */
            backdrop-filter: blur(5px); /* Soft blur effect */
        }

        /* Company Name Logo */
        .company-logo h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Horizontal Menu Items */
        .nav-menu {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-menu li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* Hover Effect for Menu Links */
        .nav-menu li a:hover {
            color: #00adb5; 
        }

        /* Main Welcome Content Area */
        .welcome-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: calc(100vh - 80px); /* Subtract header height */
            color: #ffffff;
            padding: 0 20px;
        }

        .welcome-content h2 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .welcome-content p {
            font-size: 18px;
            max-width: 600px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Full Page Background Wrapper -->
    <div class="hero-background">
        
        <!-- Header containing Company Name and Horizontal Menu -->
        <header>
            <div class="company-logo">
                <h1>Ampra Innovations</h1>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="technologies.html">Technologies</a></li>
                    <li><a href="solutions.html">Solutions</a></li>
                    <li><a href="industries.html">Industries</a></li>
<!--                    <li><a href="projects.html">Projects</a></li>
-->                    <li><a href="about.html">About</a></li>
<!--                    <li><a href="portfolio.html">Portfolio</a></li>
-->                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Main Content Overlay -->
        <div class="welcome-content">
            <h2 style="color:#7fffd4;"> Contact</h2>
            <p>Email: amprainnovations@gmail.com</p>
        </div>
    </div>

</body>
</html>
